<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconocratie — Présentation autonome</title>
<style>
:root{color-scheme:dark;font-family:Helvetica Neue,Arial,sans-serif;color:#e9eef1;background:#080a0d}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}button,select{font:inherit;color:inherit;background:#202a33;border:1px solid #40525f;border-radius:5px;padding:7px 10px;cursor:pointer}button:hover{background:#334653}button:disabled{opacity:.45}aside{background:#18212a;border-right:1px solid #30404c;width:235px;flex:0 0 235px;display:flex;flex-direction:column;overflow:auto;padding:14px 10px}aside h1{font-size:15px;letter-spacing:.12em;margin:4px 5px 0}aside small{color:#8b9aa5;margin:4px 5px 18px}#libraryTitle{font-size:12px;color:#b7c8d5;margin:0 5px 9px;overflow-wrap:anywhere}#deckList{display:flex;flex-direction:column;gap:4px}#deckList button{text-align:left;font-size:12px;width:100%;overflow-wrap:anywhere}#deckList button.active{background:#244861;border-color:#72a8c5}.app{display:flex;height:100dvh}main{min-width:0;flex:1;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #30404c;min-height:52px}.toolbar strong{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toolbar .counter{font-size:11px;color:#9baebc}.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:#090b0e}.frame{width:100%;height:100%;max-height:100%;max-width:100%;position:relative;overflow:hidden;display:grid;place-items:center;background:#000;container-type:inline-size}.frame.ratio{height:auto;aspect-ratio:var(--ratio);width:min(100%,calc((100dvh - 100px)*var(--ratio)))}.frame.gallery-detail img{cursor:zoom-out}.frame img,.frame video{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.frame .cover{object-fit:cover}.frame .fill{object-fit:fill}.frame audio{width:min(85%,620px)}.frame iframe{border:0;width:100%;height:100%;background:#fff}.titlepage{position:absolute;inset:0;display:flex;padding:7%;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}.titlecopy{max-width:100%;min-width:0}.gallery{position:absolute;inset:0;overflow:auto;background:var(--gallery-bg,#090b0e);padding:var(--gap,10px);align-content:start}.gallery.grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:var(--gap,10px);grid-auto-rows:max-content}.gallery.columns{column-count:var(--cols,4);column-gap:var(--gap,10px)}.gallery.justify{display:flex;flex-wrap:wrap;align-content:flex-start;gap:var(--gap,10px)}.gallery-item{position:relative;background:#18232c;border:1px solid #394b58;cursor:zoom-in;overflow:hidden;min-width:0}.gallery-item .visual{min-height:60px;aspect-ratio:4/3;display:grid;place-items:center;background:#111a21;overflow:hidden}.gallery-item img{width:100%;height:100%;object-fit:contain;display:block}.gallery.columns .gallery-item{width:100%;display:inline-block;break-inside:avoid;margin-bottom:var(--gap,10px)}.gallery.columns .visual{aspect-ratio:auto}.gallery.columns img{height:auto}.gallery.justify .gallery-item{flex:var(--weight,1.4) 1 calc(120px*var(--weight,1.4));max-width:100%;min-width:90px}.gallery.justify .visual{aspect-ratio:var(--weight,1.4)}.gallery-item .caption{font-size:10px;padding:5px 7px;color:#beced8;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.gallery-item .visual.title-mini{padding:15px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}.gallery-item .visual.media-mini{font-size:14px;color:#a9c7d7}.controls{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:6px;border-top:1px solid #293641}.controls[hidden],.gallery[hidden],.frame[hidden],#back[hidden]{display:none!important}#back{position:static;background:#192a36e8}#back:not([hidden]){display:block}#viewer:fullscreen{background:#000}#viewer:fullscreen .toolbar,#viewer:fullscreen .controls{display:none}#viewer:fullscreen .stage{padding:0}#viewer:fullscreen .frame.ratio{width:min(100%,calc(100dvh*var(--ratio)))}.prefs{margin-top:auto;padding-top:16px;font-size:11px;color:#aabac5}.prefs summary{cursor:pointer;padding:6px}.prefs div{line-height:1.9}.webbox{display:flex;flex-direction:column;width:100%;height:100%}.webbox .weblinks{display:flex;gap:10px;justify-content:space-between;padding:8px 10px;background:#202d38;font-size:12px}.webbox iframe{flex:1;min-height:0}.webbox a{color:#9ad3f4}.textslide{max-width:90%;max-height:90%;overflow:auto;white-space:pre-wrap;font:16px/1.5 ui-monospace,monospace}@media(max-width:640px){aside{width:150px;flex-basis:150px;padding:8px 5px}.toolbar{gap:4px;padding:6px}.toolbar strong{font-size:12px}.frame.ratio{width:min(100%,calc((100dvh - 92px)*var(--ratio)))}.gallery.grid{grid-template-columns:repeat(min(var(--cols,4),3),minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app"><aside><h1>ICONOCRATIE</h1><small>dsf©2026</small><div id="libraryTitle"></div><nav id="deckList"></nav><details class="prefs"><summary>Raccourcis</summary><div>Espace : lecture / pause</div><div>↑ / ↓ : précédent / suivant</div><div>F : plein écran</div><div>Échap : fermer / revenir à la galerie</div></details></aside><main id="viewer"><header class="toolbar"><strong id="deckTitle"></strong><span class="counter" id="counter"></span><button id="fullscreen" title="Plein écran">⛶</button></header><div class="stage"><div id="frame" class="frame"></div><div id="gallery" class="gallery" hidden></div></div><footer class="controls" id="controls"><button id="prev" title="Précédent">‹</button><button id="play">▶ Lecture</button><button id="next" title="Suivant">›</button></footer></main></div>
<script type="application/json" id="presentation-data">__ICONOCRATIE_DATA__</script>
<script>
'use strict';
(()=>{
const payload=JSON.parse(document.getElementById('presentation-data').textContent);
const decks=Array.isArray(payload.decks)?payload.decks:[];
const prefs=payload.preferences||{};
const $=id=>document.getElementById(id);
let deckIndex=0,slideIndex=0,playing=false,delay=null,inDetail=false,galleryScroll=0;const blobUrls=new Map();
function returnToGallery(){if(mode()==='slideshow'||!inDetail)return;stop();inDetail=false;render()}
$('libraryTitle').textContent=payload.libraryName||'Bibliothèque';
const font=(value)=>value==='system-ui'?'system-ui, sans-serif':'"'+String(value||'Helvetica Neue').replace(/["\\]/g,'')+'",Arial,sans-serif';
function mediaURL(slide){return slide.data||''}
function blobMediaURL(slide){
 if(blobUrls.has(slide))return blobUrls.get(slide);
 const data=mediaURL(slide);if(!data.startsWith('data:'))return data;
 const comma=data.indexOf(',');if(comma<0)return '';
 const mime=/^data:([^;]+)/i.exec(data.slice(0,comma))?.[1]||'application/octet-stream';
 const binary=atob(data.slice(comma+1)),parts=[];
 for(let i=0;i<binary.length;i+=65536){const piece=binary.slice(i,i+65536);const bytes=new Uint8Array(piece.length);for(let j=0;j<piece.length;j++)bytes[j]=piece.charCodeAt(j);parts.push(bytes)}
 const url=URL.createObjectURL(new Blob(parts,{type:mime}));blobUrls.set(slide,url);return url
}
function type(slide){return slide.kind==='title'?'title':slide.kind==='link'?'link':(slide.type||'').split('/')[0]||'other'}
function mode(){return ['grid','columns','justify'].includes(decks[deckIndex]?.settings?.presentation)?decks[deckIndex].settings.presentation:'slideshow'}
function stop(){playing=false;clearTimeout(delay);delay=null;document.querySelectorAll('video,audio').forEach(m=>m.pause());$('play').textContent='▶ Lecture'}
function nextDeck(){for(let i=deckIndex+1;i<decks.length;i++)if(decks[i].slides?.length)return i;if(prefs.loopLibrary)for(let i=0;i<=deckIndex;i++)if(decks[i].slides?.length)return i;return -1}
function tick(){if(!playing)return;const d=decks[deckIndex],s=d?.slides?.[slideIndex];if(!s)return;const el=$('frame').querySelector('video,audio');if(el){el.play().catch(()=>{stop()});return}const sec=Math.min(3600,Math.max(.5,Number(d.settings?.seconds)||5));delay=setTimeout(()=>advance(1,true),sec*1000)}
function advance(amount,auto=false){const d=decks[deckIndex];if(!d?.slides?.length)return;clearTimeout(delay);const next=slideIndex+amount;if(next>=0&&next<d.slides.length){slideIndex=next;show();return}if(amount>0&&prefs.chainDecks){const nx=nextDeck();if(nx>=0){deckIndex=nx;slideIndex=0;inDetail=false;render();return}}if(d.settings?.loop&&mode()==='slideshow'){slideIndex=(next+d.slides.length)%d.slides.length;show();return}if(!auto)slideIndex=Math.max(0,Math.min(d.slides.length-1,next));else stop();show()}
function setPlay(){if(mode()!=='slideshow'&&!inDetail)return;playing=!playing;clearTimeout(delay);$('play').textContent=playing?'Ⅱ Pause':'▶ Lecture';const m=$('frame').querySelector('video,audio');if(!playing)m?.pause();else tick()}
function setDeck(i){stop();deckIndex=i;slideIndex=0;inDetail=false;galleryScroll=0;render()}
function renderNav(){$('deckList').replaceChildren();decks.forEach((d,i)=>{const btn=document.createElement('button');btn.textContent=d.name||'Diaporama';btn.classList.toggle('active',i===deckIndex);btn.onclick=()=>setDeck(i);$('deckList').append(btn)})}
function createTitle(slide){const t={text:'Titre',font:'Helvetica Neue',size:64,color:'#ffffff',background:'#000000',align:'center',x:'center',y:'center',weight:'400',line:1.15,...(slide.title||{})};const div=document.createElement('div');div.className='titlepage';div.style.background=t.background;div.style.color=t.color;div.style.fontFamily=font(prefs.globalFontEnabled?prefs.globalFont:t.font);div.style.fontSize=`clamp(9px,${Math.max(8,Math.min(300,Number(t.size)||64))/19.2}cqw,300px)`;div.style.fontWeight=t.weight;div.style.lineHeight=t.line;div.style.justifyContent=({left:'flex-start',center:'center',right:'flex-end'})[t.x]||'center';div.style.alignItems=({top:'flex-start',center:'center',bottom:'flex-end'})[t.y]||'center';const copy=document.createElement('div');copy.style.textAlign=t.align;copy.textContent=t.text;div.append(copy);return div}
function show(){clearTimeout(delay);const d=decks[deckIndex],s=d?.slides?.[slideIndex],frame=$('frame');frame.replaceChildren();$('counter').textContent=s?(slideIndex+1)+' / '+d.slides.length:'0 / 0';if(!s){frame.textContent='Aucun média';return}const fit=d.settings?.fit||'contain';const ratio=d.settings?.ratio||'screen';frame.classList.toggle('ratio',ratio!=='screen');let rw=16/9;if(ratio==='custom')rw=(Number(d.settings.width)||1920)/(Number(d.settings.height)||1080);else if(ratio!=='screen'){const a=ratio.split(':').map(Number);rw=a[0]/a[1]||16/9}frame.style.setProperty('--ratio',rw);
const k=type(s);let el=null;if(k==='title')el=createTitle(s);
else if(k==='image'){el=document.createElement('img');el.src=mediaURL(s);if(fit==='cover'||fit==='fill')el.classList.add(fit);if(mode()!=='slideshow'&&inDetail){el.title='';el.addEventListener('click',returnToGallery)}}
else if(k==='video'||k==='audio'){el=document.createElement(k);el.src=blobMediaURL(s);el.controls=true;if(k==='video'){el.playsInline=true;if(fit==='cover'||fit==='fill')el.classList.add(fit)}el.onended=()=>{if(playing)advance(1,true)}}
else if(k==='link'){el=document.createElement('div');el.className='webbox';const hdr=document.createElement('div');hdr.className='weblinks';const info=document.createElement('span');info.textContent=s.name;const a=document.createElement('a');a.textContent='Ouvrir dans un onglet';a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';hdr.append(info,a);const ifr=document.createElement('iframe');ifr.src=s.url;ifr.referrerPolicy='no-referrer';el.append(hdr,ifr)}
else if(k==='application'||(s.type||'').includes('pdf')){el=document.createElement('iframe');el.src=blobMediaURL(s)}
else if(k==='text'){el=document.createElement('pre');el.className='textslide';try{el.textContent=new TextDecoder().decode(Uint8Array.from(atob(mediaURL(s).split(',')[1]),c=>c.charCodeAt(0)))}catch{el.textContent=s.name}}
else {el=document.createElement('div');el.textContent='Média non prévisualisable : '+s.name}
frame.append(el);if(playing)tick();}
function gallery(){const d=decks[deckIndex],root=$('gallery'),m=mode(),cols=Math.min(12,Math.max(1,Number(d.settings?.galleryCols)||4));root.replaceChildren();root.className='gallery '+m;root.style.setProperty('--cols',cols);root.style.setProperty('--gap',Math.max(0,Number(d.settings?.galleryGap)||0)+'px');root.style.setProperty('--gallery-bg',d.settings?.galleryBg||'#090b0e');(d.slides||[]).forEach((s,i)=>{const card=document.createElement('div');card.className='gallery-item';card.tabIndex=0;const v=document.createElement('div');v.className='visual';const k=type(s);if(k==='image'){const img=document.createElement('img');img.src=mediaURL(s);img.loading='lazy';img.onload=()=>{const r=img.naturalWidth/Math.max(1,img.naturalHeight);card.style.setProperty('--weight',Math.max(.6,Math.min(2.8,r)));if(m==='columns')v.style.aspectRatio='auto'};v.append(img)}else if(k==='title'){v.classList.add('title-mini');v.textContent=s.title?.text||s.name;v.style.background=s.title?.background||'#000';v.style.color=s.title?.color||'#fff'}else{v.classList.add('media-mini');v.textContent=({video:'▶ VIDÉO',audio:'♫ AUDIO',application:'PDF',link:'↗ WEB',text:'TEXTE'})[k]||'MÉDIA'}const cap=document.createElement('div');cap.className='caption';cap.textContent=(i+1)+' · '+s.name;card.append(v);if(d.settings?.galleryShowNames!==false)card.append(cap);const open=()=>{galleryScroll=root.scrollTop;slideIndex=i;inDetail=true;render();};card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter')open()};root.append(card)});requestAnimationFrame(()=>{if(root.isConnected&&!inDetail)root.scrollTop=galleryScroll});}
function render(){renderNav();const d=decks[deckIndex];$('deckTitle').textContent=d?.name||'Bibliothèque vide';const gal=mode()!=='slideshow'&&!inDetail;$('gallery').hidden=!gal;$('frame').hidden=gal;$('controls').hidden=mode()!=='slideshow';$('frame').classList.toggle('gallery-detail',mode()!=='slideshow'&&inDetail);if(gal){stop();gallery()}else{show();$('play').textContent=playing?'Ⅱ Pause':'▶ Lecture'}}
$('prev').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);$('play').onclick=setPlay;$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('viewer').requestFullscreen?.()};window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='Escape'&&inDetail){returnToGallery()}else if(e.code==='Space'){e.preventDefault();setPlay()}else if(e.key==='ArrowDown'){e.preventDefault();advance(1)}else if(e.key==='ArrowUp'){e.preventDefault();advance(-1)}else if(e.key.toLowerCase()==='f'){$('fullscreen').click()}});
render();
})();
</script>
</body></html>
